services:
  kairos:
    build: .
    ports:
      - "8000:8000"          # API + dashboard: http://localhost:8000
    env_file: .env
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      KAIROS_SOURCES_FILE: /app/config/sources.yaml
    volumes:
      - kairos_data:/app/data                     # DuckDB, uploads, transfers
      - ./config:/app/config:ro                   # put your sources.yaml here
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Optional: a real SFTP server to demo the SFTP connector (docker compose --profile demo up)
  sftp-demo:
    image: atmoz/sftp:alpine
    profiles: ["demo"]
    ports:
      - "2222:22"
    volumes:
      - ./data/demo/ftp/kpis:/home/kairos/kpis:ro
    command: kairos:kairos-demo:1001

volumes:
  kairos_data:
